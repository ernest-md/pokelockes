name: Audit encounter sources
on:
  push:
    paths:
      - scripts/audit_pokearth.py
      - .github/workflows/encounters-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/audit_pokearth.py
