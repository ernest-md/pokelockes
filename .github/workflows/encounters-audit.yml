name: Audit encounter sources
on:
  push:
    paths:
      - scripts/audit_pokearth.py
      - .github/workflows/encounters-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/audit_pokearth.py
      - name: Publish audited source dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verified-encounters.js
          if ! git diff --staged --quiet; then
            git commit -m 'Update route encounters verified against Pokéarth'
            git push
          fi
